# Render Blueprint: PostgreSQL + Django API. Deploy the frontend on Vercel (see README).
databases:
  - name: cmrs-db
    databaseName: cmrs
    plan: free

services:
  - type: web
    name: cmrs-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase: { name: cmrs-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://cmrs.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
