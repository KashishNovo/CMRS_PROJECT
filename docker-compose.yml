# One command to run the whole stack:  docker compose up --build
# App: http://localhost:8080   API docs: http://localhost:8080/api/docs/
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cmrs
      POSTGRES_USER: cmrs
      POSTGRES_PASSWORD: cmrs
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmrs"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: local-docker-secret-change-me-0123456789abcdef
      DJANGO_DEBUG: "0"
      SECURE_SSL_REDIRECT: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://cmrs:cmrs@db:5432/cmrs
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
